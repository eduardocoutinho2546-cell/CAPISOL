<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAPISOL · Biblioteca operacional</title><style>body{font:15px/1.5 system-ui,sans-serif;background:#f5f8fa;color:#12202b;margin:0}header{background:#0b1f33;color:#fff;padding:28px max(20px,calc((100% - 1120px)/2))}main{max-width:1120px;margin:24px auto;padding:0 20px}.bar{display:flex;gap:10px;flex-wrap:wrap}.bar input,.bar select{padding:10px;border:1px solid #bacbd6;border-radius:8px;min-width:240px}.card{background:#fff;border:1px solid #d9e2ea;border-radius:14px;padding:16px;margin:12px 0}.meta{color:#587080;font-size:13px}.pill{display:inline-block;background:#e4f2fa;color:#15597c;border-radius:99px;padding:3px 8px;margin:3px;font-size:12px}.error{color:#9a1b1b}</style></head><body><header><strong>CAPISOL · Escritório 4.0</strong><h1>Biblioteca operacional</h1><p>72 categorias, funções do anexo, protocolo de entrada/saída e gates de segurança.</p></header><main><p><a href="../saas/">Abrir revisões e tarefas dos 72 setores →</a></p><div class="bar"><input id="q" placeholder="Pesquisar área ou função"><select id="area"><option value="">Todas as áreas</option></select></div><p id="count" class="meta"></p><section id="list"></section></main><script>const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[];function render(){const q=$('q').value.toLocaleLowerCase('pt-BR'),a=$('area').value;const xs=data.filter(x=>(!a||x.id===a)&&(!q||(x.categoria+' '+x.funcoes.join(' ')).toLocaleLowerCase('pt-BR').includes(q)));$('count').textContent=`${xs.length} de ${data.length} categorias exibidas`;$('list').innerHTML=xs.map(x=>`<article class="card"><h2>${x.numero}. ${esc(x.categoria)}</h2><p>${x.funcoes.map(esc).map(y=>`<span class="pill">${y}</span>`).join('')}</p><div class="meta"><b>Entrada:</b> ${x.protocolo.entrada.join(' · ')}<br><b>Saída:</b> ${x.protocolo.saida.join(' · ')}<br><b>Gates:</b> ${x.protocolo.gates.join(' · ')}</div></article>`).join('')||'<p>Nenhum resultado.</p>'}fetch('capacidades.json').then(r=>{if(!r.ok)throw new Error('Biblioteca indisponível');return r.json()}).then(x=>{data=x.capacidades;data.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=`${a.numero}. ${a.categoria}`;$('area').append(o)});render()}).catch(e=>{$('list').innerHTML=`<p class="error">${esc(e.message)}. Recarregue a página.</p>`});$('q').oninput=render;$('area').onchange=render;</script></body></html>

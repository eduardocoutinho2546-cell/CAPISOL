<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAPISOL · Plano Acre</title><style>:root{--navy:#0b1f33;--blue:#1677b9;--sun:#f3b51b;--paper:#f5f8fa;--line:#d9e2ea;--ink:#12202b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}header{background:linear-gradient(120deg,var(--navy),#145f7d);color:#fff;padding:34px max(22px,calc((100% - 1120px)/2))}main{max-width:1120px;margin:24px auto;padding:0 22px}.eyebrow{color:var(--sun);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}h1{font-size:clamp(28px,5vw,48px);margin:.2em 0}.sub{opacity:.82}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}.metric{font-size:28px;font-weight:900;color:var(--blue)}.label{font-size:12px;color:#5b7181}.pill{display:inline-block;background:#e4f2fa;color:#15597c;border-radius:99px;padding:3px 8px;margin:3px;font-size:12px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:#5b7181}input{width:100%;padding:8px;border:1px solid #b9c8d4;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}</style></head><body><header><div class="eyebrow">CAPISOL · gestão comercial</div><h1>Plano Acre</h1><div class="sub">Metas, indicadores e gates do produto foco: kit de 1.000 kWh.</div></header><main><section class="grid" id="cards"></section><section class="card"><h2>Território de execução</h2><div id="territory"></div></section><section class="card"><h2>Indicadores de sucesso</h2><table><thead><tr><th>Indicador</th><th>Frequência</th><th>Dono</th><th>Meta</th><th>Realizado demo</th></tr></thead><tbody id="kpis"></tbody></table></section><section class="card"><h2>Regras de caixa e aprovação</h2><ul id="gates"></ul><button id="reset">Limpar realizados da demo</button></section></main><script>const $=x=>document.getElementById(x);const KEY='capisol.plano.acre.realizados.v1';const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),8000);fetch('../data/plano-comercial-acre.json',{signal:ctl.signal}).finally(()=>clearTimeout(timer)).then(r=>{if(!r.ok)throw new Error('Não foi possível carregar as metas');return r.json()}).then(p=>{const m=p.metas['primeiros_30_dias'];$('cards').innerHTML=[['Receita mínima',`R$ ${m.receita_bruta_min.toLocaleString('pt-BR')}`],['Vendas',m.vendas_fechadas],['Propostas',m.propostas_enviadas],['Leads qualificados',m.leads_qualificados]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('');$('territory').innerHTML=[['Zona 1',p.territorio.zona_1],['Zona 2',p.territorio.zona_2],['Zona 3',p.territorio.zona_3]].map(x=>`<p><strong>${x[0]}</strong><br>${x[1].map(y=>`<span class="pill">${y}</span>`).join('')}</p>`).join('')+`<p>${p.territorio.regra}</p>`;const saved=JSON.parse(localStorage.getItem(KEY)||'{}');$('kpis').innerHTML=p.kpis.map(k=>`<tr><td>${k.nome}</td><td>${k.frequencia}</td><td>${k.dono}</td><td>${k.meta}</td><td><input data-k="${k.id}" value="${saved[k.id]||''}" placeholder="lançar"></td></tr>`).join('');document.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{const x=JSON.parse(localStorage.getItem(KEY)||'{}');x[i.dataset.k]=i.value;localStorage.setItem(KEY,JSON.stringify(x))});$('gates').innerHTML=p.gate_producao.map(x=>`<li>${x}</li>`).join('')}).catch(error=>{$('cards').innerHTML=`<div class="card"><strong>Falha ao carregar o plano.</strong><p>${error.message}</p><button onclick="location.reload()">Tentar novamente</button></div>`});$('reset').onclick=()=>{localStorage.removeItem(KEY);location.reload()};</script></body></html>

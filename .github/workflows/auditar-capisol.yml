name: Auditar CAPISOL

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integridade:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe do módulo BelEnergy
        run: node --check inteligencia/cotacoes-panel.mjs
      - name: Validar rota de privacidade e canal comercial oficial
        run: node tools/verify-privacy-links.mjs
      - name: Auditar catálogo, regras e integrações
        run: node tools/audit-capisol.mjs
      - name: Auditar runtime, peso, backup e biblioteca
        run: node tools/audit-production.mjs
      - name: Testar fila, setores e cálculos
        run: node --test gateway/test/*.test.mjs saas/test/*.test.mjs workers/media/*.test.mjs
      - name: Conferir blog e scripts da redação
        run: node tools/test-blog-syntax.mjs
      - name: Procurar segredos proibidos
        run: |
          if grep -RInE 'service_role=[^[:space:]]|sk-[A-Za-z0-9]{20,}|WHATSAPP_TOKEN=[^[:space:]]|client_secret=[^[:space:]]' --exclude-dir=.git --exclude='*.md' --exclude='auditar-capisol.yml' .; then
            echo 'Segredo ou token encontrado no código versionado.'
            exit 1
          fi

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar teste visual
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Instalar navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Verificar versões de posts e estúdio local
        run: |
          node --check posts/posts-ia-ui.js
          node --test posts/canais.test.mjs posts/studio-social.test.mjs
      - name: Testar fluxos do escritório
        run: node tools/test-office-ui.mjs
      - name: Testar demonstração pública isolada
        run: node tools/test-office-demo.mjs
      - name: Testar Estúdio Social em navegador real
        run: node tools/test-social-studio-ui.mjs
      - name: Testar blog público em Chromium
        run: node tools/test-blog-ui.mjs

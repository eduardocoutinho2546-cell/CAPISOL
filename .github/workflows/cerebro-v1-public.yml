name: CAPISOL Cérebro v1 - guard público
on:
  pull_request:
    paths:
      - 'saas/cerebro-v1-*'
      - '.github/workflows/cerebro-v1-public.yml'
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test saas/cerebro-v1-guard.test.mjs

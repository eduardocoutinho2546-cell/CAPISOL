name: Cérebro v1 painel Empresa hoje
on:
  pull_request:
    paths: ['saas/empresa-hoje*','saas/parametros-editor*','.github/workflows/cerebro-v1-pwa.yml']
  workflow_dispatch:
jobs:
  modelos:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test saas/empresa-hoje.test.mjs
